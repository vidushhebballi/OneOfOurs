<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shop · One of Ours</title>
<meta name="description" content="One of Ours: premium, freshly cooked meals for the pets we love. Delivered across Bengaluru.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#1F3D2E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Merriweather:wght@400;700;900&display=swap">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js" defer></script>
</head>
<body data-page="shop">
<div id="site-head"></div>
<main>
  <div class="page-head"><div class="wrap">
    <div class="eyebrow">Shop</div>
    <h1 style="margin-top:14px;font-size:clamp(36px,5vw,60px)">All recipes</h1>
    <p style="margin-top:14px;max-width:560px">Four pouch sizes, five bundle sizes, three recipes. Choose a recipe to build your bundle.</p>
    <div class="filters" role="group" aria-label="Filter recipes">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="cr" aria-pressed="false">Chicken &amp; Rice</button>
      <button class="chip" data-f="cl" aria-pressed="false">Chicken &amp; Lentils</button>
      <button class="chip" data-f="ll" aria-pressed="false">Lamb &amp; Lentils</button>
    </div>
  </div></div>
  <section class="block" style="padding-top:48px"><div class="wrap"><div class="recipes" id="shop-grid"></div></div></section>
</main>
<div id="site-foot"></div>
</body></html>
